{% extends "base.html" %}

{% block title %}Log In — Smart Event Ticketing{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card">
    <h2 class="text-center" style="margin-bottom: 0.5rem;">Welcome Back</h2>
    <p class="text-center" style="margin-bottom: 2rem;">Log in to access your event tickets and registrations.</p>

    <form method="POST" action="/auth/login">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-input" type="email" id="email" name="email" required placeholder="you@example.com" autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" name="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Log In</button>
    </form>

    <div class="text-center" style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
      Don't have an account? <a href="/auth/register">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
